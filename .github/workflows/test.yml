# Every push to main and every pull request: build, then the whole suite — the in-process tests (unit,
# component, parity, fuzz) and the browser tests against the e2e app built with each SDK. Every step
# goes through Turborepo (turbo.json) with the remote cache: what did not change is not rebuilt or
# re-run.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # (pnpm version from package.json `packageManager`)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Turborepo's local cache, kept between runs by GitHub's cache (the remote cache, when set up,
      # is consulted too: a task misses only when neither has it)
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # the library, fixtures, the bench bundle, the e2e app per SDK, then every test but the long two
      - run: pnpm turbo run test:ci
      # the long ones, lighter: a few fuzz seeds (the perf test runs locally: CI machines are noisy)
      - run: pnpm turbo run test:editor-fuzz
        env:
          EDITOR_FUZZ_SEEDS: 2
