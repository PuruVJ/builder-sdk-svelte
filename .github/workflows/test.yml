# Every push to main and every pull request: build, then the whole suite — the in-process tests (unit,
# component, parity, fuzz) and the browser tests against the e2e app built with both SDKs.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # (pnpm version from package.json `packageManager`)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm fixtures && pnpm bench:build
      - run: pnpm e2e:build
      - run: pnpm vitest run --exclude tests/editor-fuzz.test.ts --exclude tests/editor-perf.test.ts
      # the long ones, lighter: a few fuzz seeds; perf numbers printed (CI machines are noisy)
      - run: EDITOR_FUZZ_SEEDS=2 pnpm vitest run tests/editor-fuzz.test.ts
