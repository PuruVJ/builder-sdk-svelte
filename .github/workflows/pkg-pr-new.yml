# A preview package for every push and pull request (https://pkg.pr.new): install a PR's build with
#   pnpm add https://pkg.pr.new/PuruVJ/builder-sdk-svelte/@puruvj/builder-sdk-svelte@<commit or PR number>
# Needs the pkg.pr.new GitHub App installed on this repository.
name: pkg.pr.new

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# (the build comes from Turborepo's remote cache when the test workflow already built this commit)
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # (pnpm version from package.json `packageManager`)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Turborepo's local cache, kept between runs by GitHub's cache (plus the remote cache)
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm dlx pkg-pr-new publish --pnpm --packageManager=pnpm
