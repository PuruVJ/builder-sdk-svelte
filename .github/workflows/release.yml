# Changesets release: on every push to main, open (or update) a "Version Packages" pull request
# from the pending changesets; merging that pull request publishes the new version to npm and tags
# it. Publishing uses npm trusted publishing (OIDC, configured on npmjs.com for this workflow file):
# no npm token is stored anywhere, and the package gets provenance. See .changeset/README.md.
name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version commits and tags
  pull-requests: write # the "Version Packages" pull request
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (pnpm version from package.json `packageManager`)
      - uses: pnpm/action-setup@v4
      # Node 24 ships npm 11, which publishes with an OIDC token (trusted publishing needs npm >= 11.5.1)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Pending changesets: open / update the "Version Packages" pull request (no publishing here).
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets (the version pull request was just merged): publish the version in
      # package.json if npm does not have it yet, then tag it.
      - id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.unpublished.outputs.version
        run: pnpm build
      - if: steps.unpublished.outputs.version
        run: npm publish --provenance --access public
      - if: steps.unpublished.outputs.version
        run: |
          git tag "v${{ steps.unpublished.outputs.version }}"
          git push origin "v${{ steps.unpublished.outputs.version }}"
          gh release create "v${{ steps.unpublished.outputs.version }}" --title "v${{ steps.unpublished.outputs.version }}" --notes "See [CHANGELOG.md](https://github.com/PuruVJ/builder-sdk-svelte/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
